<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formwell | Treinos & gestão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">FW</span><span>formwell</span></div>
      <div class="workspace-label">Workspace <strong>Northside Training</strong></div>

      <div class="account-switch" aria-label="Conta de teste">
        <button class="switch-button active" data-role="admin">Administrador</button>
        <button class="switch-button" data-role="client">Cliente</button>
      </div>

      <nav class="nav-list" aria-label="Navegação principal">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">▦</span> Visão geral</button>
        <button class="nav-item" data-view="clients"><span class="nav-icon">◎</span> Clientes</button>
        <button class="nav-item" data-view="plans"><span class="nav-icon">▤</span> Planos</button>
        <button class="nav-item" data-view="messages"><span class="nav-icon">✉</span> Mensagens <span class="dot"></span></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item"><span class="nav-icon">⚙</span> Configurações</button>
        <div class="profile">
          <div class="avatar trainer-avatar" id="sidebar-avatar">JM</div>
          <div>
            <strong id="sidebar-name">Jordan Miles</strong>
            <small id="sidebar-role">Administrador</small>
          </div>
          <span class="more">•••</span>
        </div>
      </div>
    </aside>

    <section class="content">
      <header class="topbar">
        <div class="mobile-brand">formwell</div>
        <div class="breadcrumb">Workspace <span>/</span> <strong id="page-title">Visão geral</strong></div>
        <div class="top-actions">
          <button class="icon-button" title="Notificações">♧<span class="notification"></span></button>
          <button class="user-chip" id="user-chip">
            <span class="avatar trainer-avatar small" id="topbar-avatar">JM</span>
            <span id="topbar-user-name">Jordan Miles</span>
            <span>⌄</span>
          </button>
        </div>
      </header>

      <div class="page-wrap">
        <section class="welcome-row" id="welcome-row"></section>
        <section class="metric-grid" id="metrics-grid" aria-label="Resumo financeiro e de performance"></section>
        <section class="main-grid" id="main-grid"></section>
        <section id="content-panel" class="content-panel"></section>
      </div>
    </section>
  </main>

  <dialog id="plan-dialog">
    <form id="plan-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Planejamento</p>
          <h2 id="plan-dialog-title">Novo treino</h2>
        </div>
        <button type="button" class="close-button" id="close-plan-dialog">×</button>
      </div>

      <div class="dialog-grid">
        <label>Cliente
          <select name="clientId" id="plan-client-id"></select>
        </label>
        <label>Recorrência
          <select name="frequency" id="plan-frequency">
            <option value="semanal">Semanal</option>
            <option value="mensal">Mensal</option>
          </select>
        </label>

        <label>Dia da semana
          <select name="dayName" id="plan-day-name">
            <option value="Segunda">Segunda</option>
            <option value="Terça">Terça</option>
            <option value="Quarta">Quarta</option>
            <option value="Quinta">Quinta</option>
            <option value="Sexta">Sexta</option>
            <option value="Sábado">Sábado</option>
            <option value="Domingo">Domingo</option>
          </select>
        </label>

        <label>Dia do mês
          <input type="number" name="dayNumber" id="plan-day-number" min="1" max="31" value="15">
        </label>

        <label>Nome do treino
          <input type="text" name="title" placeholder="Ex.: Treino de força" required>
        </label>

        <label>Categoria
          <select name="category">
            <option value="Força">Força</option>
            <option value="Mobilidade">Mobilidade</option>
            <option value="Cardio">Cardio</option>
            <option value="Core">Core</option>
            <option value="Recuperação">Recuperação</option>
            <option value="Avaliacao">Avaliação</option>
          </select>
        </label>

        <label>Horário
          <input type="time" name="time" value="08:00">
        </label>

        <label>Duração
          <input type="text" name="duration" value="45 min" placeholder="45 min">
        </label>
      </div>

      <div class="exercise-section">
        <div class="exercise-header">
          <strong>Lista de exercícios</strong>
          <button type="button" class="secondary-button" id="add-exercise">＋ Adicionar exercício</button>
        </div>
        <div id="exercise-list" class="exercise-list"></div>
      </div>

      <label>Observação
        <textarea name="notes" rows="3" placeholder="Descreva o foco do treino..."></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" class="secondary-button" id="cancel-plan-dialog">Cancelar</button>
        <button type="submit" class="primary-button">Salvar treino</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
